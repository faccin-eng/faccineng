{% load wagtailcore_tags wagtailimages_tags %}

<div class="full-width-container">
    <div class="full-width-column" style="{% if value.background_image %}background-image: url('{{ value.background_image.file.url }}'); {% endif %}min-height: {{ value.min_height|default:300 }}px;">
        <div class="column-content">
            {% for block in value.content %}
                {% include_block block %}
            {% endfor %}
        </div>
    </div>
</div>
